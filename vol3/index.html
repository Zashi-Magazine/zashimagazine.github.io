<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Vol.3 | Zashi Magazine</title>
<style>
@font-face{font-family:Audiowide;src:url(fonts/audiowide.woff2) format("woff2");font-display:swap}
@font-face{font-family:Jura;font-weight:400;src:url(fonts/jura-400.woff2) format("woff2");font-display:swap}
@font-face{font-family:Jura;font-weight:600;src:url(fonts/jura-600.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Share Tech Mono";src:url(fonts/stm.woff2) format("woff2");font-display:swap}
:root{
  --ol0:#f1ecc9; --ol1:#ddd5a2; --ol2:#bdb37a; --ol3:#8f8854; --ol4:#5f5b35; --ol5:#3f3d24;
  --ink:#4a4836; --ink2:#6d6b5c; --line:rgba(255,253,236,.55); --line2:rgba(255,253,236,.28);
  --mono:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace;
  --round:Audiowide,"Arial Rounded MT Bold",sans-serif; --thin:Jura,"Trebuchet MS",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:clip}
body{color:var(--ink);font-family:var(--thin);background:var(--ol2);overflow-x:hidden;-webkit-text-size-adjust:100%}
/* the sepia beach-photo atmosphere, built from light, haze and grain */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(255,255,236,0) 50%,rgba(255,255,236,.32) 55.5%,rgba(255,255,236,0) 58%),
    linear-gradient(180deg,rgba(0,0,0,0) 58%,rgba(70,66,36,.18) 75%,rgba(70,66,36,.32) 100%),
    radial-gradient(110% 80% at 68% 8%,var(--ol0) 0%,var(--ol1) 30%,var(--ol2) 62%,var(--ol3) 100%)}
.sky::before,.sky::after{content:"";position:absolute;top:0;bottom:0;width:6vw;background:linear-gradient(90deg,rgba(63,61,36,.62),rgba(63,61,36,.28) 80%,rgba(63,61,36,0))}
.sky::before{left:0}.sky::after{right:0;transform:scaleX(-1)}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.22;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .28  0 0 0 0 .15  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
/* wireframe wheels */
.fx{position:absolute;left:0;top:0;width:100%;height:100vh;height:100svh;min-height:640px;overflow:hidden;pointer-events:none;z-index:2}
.wheels{position:absolute;z-index:2;pointer-events:none;left:-6vmin;top:-4vmin;width:min(118vmin,980px);height:min(118vmin,980px);opacity:.9}
.wheels circle,.wheels line{fill:none;stroke:var(--line);stroke-width:2.2;vector-effect:non-scaling-stroke}
.wheels .ghost circle,.wheels .ghost line{stroke:var(--line2);stroke-width:7}
.wheels .spin{transform-box:view-box;animation:spin 140s linear infinite}
.wheels .spin.b{animation-duration:90s;animation-direction:reverse}
.wheels .spin.c{animation-duration:200s}
@keyframes spin{to{rotate:360deg}}
/* binary field */
.binary{position:absolute;z-index:2;left:5vw;right:5vw;bottom:5vh;height:42vh;overflow:hidden;pointer-events:none;
  font:13px/1.28 var(--mono);letter-spacing:.06em;color:rgba(255,253,236,.36);white-space:pre;
  text-shadow:0 0 1px rgba(63,61,36,.35);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 18%,#000 85%,transparent),linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(180deg,transparent,#000 18%,#000 85%,transparent),linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-composite:intersect}
.mono{font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase}
.logo{font-family:var(--round);font-weight:400;color:#6f6d63;margin:0;line-height:.95;
  -webkit-text-stroke:2px rgba(255,253,238,.75);paint-order:stroke fill;
  text-shadow:0 2px 0 rgba(63,61,36,.22)}
.say{font-family:var(--round);font-size:15px;color:var(--ink2);letter-spacing:.04em;margin:.35em 0 0}
.say b{font-weight:400;border-bottom:1px solid var(--ink2)}
/* frames with corner ticks */
.frame{position:relative;border:1px solid rgba(74,72,54,.55)}
.frame::before,.frame::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--ink);pointer-events:none}
.frame::before{left:-5px;top:-5px;border-right:0;border-bottom:0}
.frame::after{right:-5px;bottom:-5px;border-left:0;border-top:0}
/* lock + loader */
.gate{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;transition:opacity .6s}
.gate.gone{opacity:0;pointer-events:none}
.panel{width:100%;max-width:440px;padding:30px 30px 24px;background:rgba(255,253,236,.2);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.panel .logo{font-size:clamp(64px,17vw,96px)}
.panel .mono.small{font-size:11px;color:var(--ink2);margin:0 0 18px}
.panel label{display:block;font-size:11px;margin:26px 0 8px;color:var(--ink)}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;height:44px;padding:0 14px;border:1px solid rgba(74,72,54,.6);border-radius:22px;background:rgba(255,253,238,.72);
  font:16px var(--mono);letter-spacing:.3em;color:var(--ol5);outline:none}
.row input:focus{border-color:var(--ol5);box-shadow:0 0 0 3px rgba(255,253,236,.6)}
.row button,.btn{height:44px;padding:0 18px;border:1px solid var(--ol5);border-radius:22px;background:var(--ol5);color:var(--ol0);
  font:14px var(--round);letter-spacing:.06em;cursor:pointer}
.row button:hover,.btn:hover{background:var(--ink)}
.row button:focus-visible,.btn:focus-visible{outline:2px solid var(--ol0);outline-offset:2px}
.msg{min-height:1.4em;margin:12px 0 0;font-size:12px;color:var(--ol5)}
.msg.bad{color:#7a2e1c}
.panel.shake{animation:shake .4s}
@keyframes shake{20%,60%{translate:-6px 0}40%,80%{translate:6px 0}}
.bar{height:10px;margin-top:18px;border:1px solid var(--ol5);padding:2px}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--ol5) 0 8px,transparent 8px 11px);transition:width .2s}
.pct{display:flex;justify-content:space-between;margin-top:8px;font-size:11px}
#app{position:relative;z-index:5;opacity:0;transition:opacity .9s}
#app.on{opacity:1}
@media (prefers-reduced-motion:reduce){.wheels .spin{animation:none}.panel.shake{animation:none}#app,.gate{transition:none}}
</style>
</head>

hE7VbUTUeoFng03EuhBx8MdEgifz6ebbbS+d26LcJNGKVt8', KEYSTORE = 'zashi-v3-key';
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function (id) { return document.getElementById(id); };
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function u8b64(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }

  /* binary field */
  var bin = $('binary'), rows = [], cols = 0;
  function fill() {
    var cw = 7.9, lh = 16.6; cols = Math.ceil(bin.clientWidth / cw); var n = Math.ceil(bin.clientHeight / lh);
    rows = []; for (var r = 0; r < n; r++) { var s = ''; for (var c = 0; c < cols; c++) s += Math.random() < .5 ? '0' : '1'; rows.push(s); }
    bin.textContent = rows.join('\n');
  }
  fill(); addEventListener('resize', fill);
  if (!still) setInterval(function () {
    for (var k = 0; k < 14; k++) { var r = Math.random() * rows.length | 0, c = Math.random() * cols | 0, s = rows[r];
      if (s) rows[r] = s.slice(0, c) + (s[c] === '0' ? '1' : '0') + s.slice(c + 1); }
    bin.textContent = rows.join('\n');
  }, 110);

  var lock = $('lock'), msg = $('msg'), pw = $('pw');
  if (!(window.crypto && crypto.subtle)) {
    if (location.protocol === 'http:' && location.hostname !== 'localhost') { location.replace('https:' + location.href.slice(5)); return; }
    msg.textContent = 'this browser can’t open locked pages'; msg.className = 'msg mono bad'; return;
  }
  var salt = b64(SALT), enc = new TextEncoder();
  function derive(p) {
    return crypto.subtle.importKey('raw', enc.encode(p), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }
  function open(key, u8) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8.subarray(0, 12) }, key, u8.subarray(12)); }

  function unlock(key, remember) {
    return open(key, b64(PAYLOAD)).then(function (buf) {
      if (remember) crypto.subtle.exportKey('raw', key).then(function (raw) { try { localStorage.setItem(KEYSTORE, u8b64(new Uint8Array(raw))); } catch (e) {} });
      lock.hidden = true; $('loader').hidden = false;
      var app = $('app'); app.innerHTML = new TextDecoder().decode(buf);
      return loadAssets(key, app).then(function () { start(key, app); });
    });
  }

  function fetchBytes(url, onBytes) {
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      if (!r.body || !r.body.getReader) return r.arrayBuffer().then(function (b) { onBytes(b.byteLength); return new Uint8Array(b); });

      return (function pump() {
        return rd.read().then(function (x) {
          if (x.done) { var out = new Uint8Array(got), o = 0; parts.forEach(function (p) { out.set(p, o); o += p.length; }); return out; }
          parts.push(x.value); got += x.value.length; onBytes(x.value.length); return pump();
        });
      })();
    });
  }
  var cache = {};
  function blobUrl(key, path, type, onBytes) {
    if (cache[path]) return Promise.resolve(cache[path]);
    return fetchBytes(path, onBytes || function () {}).then(function (u8) { return open(key, u8); })
      .then(function (b) { return (cache[path] = URL.createObjectURL(new Blob([b], { type: type }))); });
  }
  function loadAssets(key, app) {
    var els = [].slice.call(app.querySelectorAll('[data-enc]')), total = 0, done = 0;
    els.forEach(function (el) { total += +el.getAttribute('data-size'); });
    var fillBar = $('barfill'), pct = $('lpct'), lf = $('lfile'), bar = fillBar.parentNode;
    function tick(n) { done += n; var p = Math.min(100, Math.round(done / total * 100)); fillBar.style.width = p + '%'; pct.textContent = p + '%'; bar.setAttribute('aria-valuenow', p); }
    return Promise.all(els.map(function (el) {
      return blobUrl(key, el.getAttribute('data-enc'), el.getAttribute('data-type'), tick).then(function (u) {
        lf.textContent = (el.getAttribute('data-label') || 'file') + ' ok'; el.src = u;
      });
    }));
  }

  function start(key, app) {
    setTimeout(function () { $('gate').classList.add('gone'); app.classList.add('on'); }, still ? 0 : 450);
    var v = app.querySelector('video'), snd = app.querySelector('#snd');
    if (v) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
    if (v && snd) snd.addEventListener('click', function () {
      v.muted = !v.muted; snd.textContent = v.muted ? '[ sound off ]' : '[ sound on ]'; snd.setAttribute('aria-pressed', String(!v.muted));
      if (!v.muted) { var q = v.play(); if (q && q.catch) q.catch(function () {}); }
    });
    var clock = app.querySelector('#clock');
    if (clock) { var t = function () { clock.textContent = 'local ' + new Date().toTimeString().slice(0, 8); }; t(); setInterval(t, 1000); }
    /* preview lightbox */
    var lb = app.querySelector('#lb'), lbImg = lb && lb.querySelector('img'), lbCap = lb && lb.querySelector('figcaption'), last = null;
    function close() { lb.hidden = true; lbImg.removeAttribute('src'); if (last) last.focus(); }
    app.querySelectorAll('.thumb').forEach(function (b) {
      b.addEventListener('click', function () {
        last = b; lb.hidden = false; lbCap.textContent = b.getAttribute('data-cap'); lbImg.alt = b.querySelector('img').alt;
        lbImg.src = b.querySelector('img').src; lb.querySelector('.x').focus();
        blobUrl(key, b.getAttribute('data-full'), 'image/webp').then(function (u) { if (!lb.hidden) lbImg.src = u; });
      });
    });
    if (lb) {
      lb.querySelector('.x').addEventListener('click', close);
      lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
      addEventListener('keydown', function (e) { if (e.key === 'Escape' && !lb.hidden) close(); });
    }
    var out = app.querySelector('#logout');
    if (out) out.addEventListener('click', function () { try { localStorage.removeItem(KEYSTORE); } catch (e) {} location.reload(); });
  }

  function fail(text) {
    msg.textContent = text; msg.className = 'msg mono bad';
    lock.classList.remove('shake'); void lock.offsetWidth; lock.classList.add('shake');
    pw.select();
  }
  lock.addEventListener('submit', function (e) {
    e.preventDefault(); if (!pw.value) return;
    msg.textContent = 'checking…'; msg.className = 'msg mono';
    derive(pw.value.trim().toLowerCase()).then(function (k) { return unlock(k, true); })
      .catch(function (err) { fail(err && err.name === 'OperationError' ? 'access denied' : 'couldn’t load — try again'); });
  });

  var saved = null; try { saved = localStorage.getItem(KEYSTORE); } catch (e) {}
  if (saved) {
    crypto.subtle.importKey('raw', b64(saved), { name: 'AES-GCM' }, true, ['decrypt'])
      .then(function (k) { return unlock(k, false); })
      .catch(function () { try { localStorage.removeItem(KEYSTORE); } catch (e) {} lock.hidden = false; $('loader').hidden = true; pw.focus(); });
  } else { pw.focus(); }
